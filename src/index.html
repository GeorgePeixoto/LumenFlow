<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumenFlow - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100">
    <div x-data="dashboard()" class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">LumenFlow - Dashboard IoT</h1>

        <!-- Status da Conexão -->
        <div class="mb-6">
            <div class="bg-white rounded-lg shadow p-4">
                <div class="flex items-center">
                    <div class="w-3 h-3 rounded-full"
                         :class="connected ? 'bg-green-500' : 'bg-red-500'"
                         x-show="connected"></div>
                    <span class="ml-2" x-text="connected ? 'Conectado ao Firebase' : 'Desconectado'"></span>
                </div>
            </div>
        </div>

        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Dispositivos Totais</h3>
                <p class="text-3xl font-bold text-blue-600" x-text="data.total_devices || 0"></p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Dispositivos Ativos</h3>
                <p class="text-3xl font-bold text-green-600" x-text="data.active_devices || 0"></p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Total Leituras</h3>
                <p class="text-3xl font-bold text-purple-600" x-text="data.total_readings || 0"></p>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Última Atualização</h3>
                <p class="text-sm text-gray-600" x-text="lastUpdate"></p>
            </div>
        </div>

        <!-- Dispositivos -->
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Dispositivos</h3>
            <div class="space-y-4">
                <template x-for="device in data.latest_readings" :key="device.nome">
                    <div class="border rounded-lg p-4 hover:bg-gray-50 transition-colors">
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-semibold text-gray-800" x-text="device.nome"></h4>
                                <p class="text-sm text-gray-600">
                                    Potência: <span class="font-medium" x-text="device.potencia.toFixed(2) + ' W'"></span> |
                                    Energia: <span class="font-medium" x-text="device.energia_kwh.toFixed(3) + ' kWh'"></span>
                                </p>
                            </div>
                            <div class="text-right">
                                <div class="text-sm text-gray-500">
                                    <span x-text="new Date(device.timestamp * 1000).toLocaleString()"></span>
                                </div>
                                <div class="w-2 h-2 rounded-full mt-1"
                                     :class="device.timestamp > (now - 300) ? 'bg-green-500' : 'bg-gray-400'"></div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Setores -->
        <div class="bg-white rounded-lg shadow p-6 mt-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Consumo por Setor</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <template x-for="setor in Object.values(data.setor_data || {})" :key="setor">
                    <div class="border rounded-lg p-4">
                        <h4 class="font-semibold text-gray-800 mb-2" x-text="setor.devices[0]"></h4>
                        <p class="text-sm text-gray-600 mb-1">
                            Potência Total: <span class="font-medium" x-text="setor.total_potencia.toFixed(2) + ' W'"></span>
                        </p>
                        <p class="text-sm text-gray-600">
                            Energia Total: <span class="font-medium" x-text="setor.total_energia_kwh.toFixed(3) + ' kWh'"></span>
                        </p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            <div class="bg-white rounded-lg p-6">
                <p class="text-gray-700">Carregando dados...</p>
            </div>
        </div>
    </div>

    <script>
        function dashboard() {
            return {
                loading: true,
                connected: false,
                data: {},
                now: Date.now() / 1000,
                lastUpdate: '',
                interval: null,

                init() {
                    this.loadData();
                    this.interval = setInterval(() => {
                        this.loadData();
                        this.now = Date.now() / 1000;
                    }, 5000);
                },

                async loadData() {
                    try {
                        const response = await fetch('http://localhost:8000/api/dashboard/public');
                        const result = await response.json();

                        if (result.success) {
                            this.data = result.data;
                            this.connected = true;
                            this.lastUpdate = new Date().toLocaleString();
                        } else {
                            this.connected = false;
                            console.error('Erro ao carregar dados:', result.error);
                        }
                    } catch (error) {
                        this.connected = false;
                        console.error('Erro de conexão:', error);
                    } finally {
                        this.loading = false;
                    }
                },

                destroy() {
                    if (this.interval) {
                        clearInterval(this.interval);
                    }
                }
            }
        }
    </script>
</body>
</html>
