# LumenFlow - Requirements
# Arquivo de configuração de ambiente para desenvolvimento

# Sistema Operacional
# Windows 10/11, macOS, Linux

# PHP Requirements
php_version: "8.3"
php_extensions:
  - "openssl"
  - "pdo_sqlite"
  - "curl"
  - "mbstring"
  - "tokenizer"
  - "json"
  - "xml"

# Node.js Requirements
node_version: "18.x"
npm_version: "9.x"

# Database
database_type: "sqlite"
database_version: "3.40.0"

# Server Requirements
server_type: "local"
server_ports:
  backend: 8000
  frontend: 5500

# Firebase Configuration
firebase:
  # Dados IoT (Wokwi)
  rtdb_url: "https://projeto-pi-bf5a6-default-rtdb.firebaseio.com"
  api_key: "AIzaSyB30ywU-Vx6NdemjfNs0Dt-zUnOYpBIZrs"

  # Autenticação de Usuários
  auth_domain: "pi-login-b7130.firebaseapp.com"
  auth_api_key: "BOPPF4U94KPksHZnFTDe2eB-FgokY5h7m0l7B7EyCwGCZNhUNdf2Rs_VKXNXzJPqwnffRgcBZCi4S0KEj8W-Jyk"
  auth_project_id: "pi-login-b7130"

# CORS Configuration
cors:
  allowed_origins:
    - "http://localhost:5500"
    - "https://*.github.io"
    - "https://wokwi.com"
  allowed_methods: ["*"]
  allowed_headers: ["*"]
  max_age: 3600

# Application Configuration
app:
  name: "LumenFlow"
  version: "1.0.0"
  environment: "local"
  debug: true
  demo_mode: false

# Monitoring
monitoring:
  enabled: true
  log_level: "info"
  update_interval: 5000
  firebase_check_interval: 30000

# Development Tools
dev_tools:
  code_editor: "vscode"
  browser: "chrome"
  api_client: "postman"

# Project Structure
project_structure:
  backend: "backend/"
  frontend: "src/"
  documentation: ".md"
  config_files: [".env", "config.js"]

# Dependencies
dependencies:
  backend:
    - "laravel/framework"
    - "guzzlehttp/guzzle"
    - "firebase/php-sdk"
  frontend:
    - "alpinejs"
    - "tailwindcss"
    - "postcss"
    - "autoprefixer"

# Scripts
scripts:
  start_backend: "php artisan serve --host=0.0.0.0 --port=8000"
  start_frontend: "python -m http.server 5500"
  test_api: "curl http://localhost:8000/api/dashboard/public"
  monitor: "node monitor-iot.js"

# Environment Variables
env_variables:
  # Laravel
  - "APP_ENV=local"
  - "APP_DEBUG=true"
  - "APP_KEY="

  # Database
  - "DB_CONNECTION=sqlite"
  - "DB_DATABASE=database.sqlite"

  # Firebase
  - "FIREBASE_RTDB_URL=https://projeto-pi-bf5a6-default-rtdb.firebaseio.com"
  - "FIREBASE_AUTH_DOMAIN=pi-login-b7130.firebaseapp.com"
  - "FIREBASE_API_KEY=BOPPF4U94KPksHZnFTDe2eB-FgokY5h7m0l7B7EyCwGCZNhUNdf2Rs_VKXNXzJPqwnffRgcBZCi4S0KEj8W-Jyk"
  - "FIREBASE_PROJECT_ID=pi-login-b7130"

  # CORS
  - "FRONTEND_URL=http://localhost:5500"
  - "WOKWI_URL=https://wokwi.com"

  # Security
  - "APP_SECRET=your-secret-key-here"
  - "JWT_SECRET=your-jwt-secret-here"

# Troubleshooting
troubleshooting:
  common_issues:
    - "Port 8000 already in use: Change port in .env"
    - "Firebase connection failed: Check API key and network"
    - "CORS error: Add origin to allowed_origins"
    - "SQLite database missing: Run php artisan migrate"
    - "Frontend not loading: Check server port and path"

  solutions:
    port_conflict: "Change port in deploy.sh or kill existing process"
    firebase_error: "Verify Firebase credentials and network connection"
    cors_error: "Update CORS configuration in backend/config/cors.php"
    migration_error: "Run php artisan migrate:fresh to reset database"
    frontend_error: "Check file permissions and server configuration"

# Performance
performance:
  cache_enabled: true
  compression_enabled: true
  minify_assets: true
  use_cdn: false

# Security
security:
  https_enabled: false
  rate_limiting: true
  input_validation: true
  sql_injection_protection: true

# Backup
backup:
  enabled: false
  database_backup: true
  files_backup: true
  backup_frequency: "daily"
  backup_retention: "30 days"